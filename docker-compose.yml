services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetbiobio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vetbiobio}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetbiobio} -d ${POSTGRES_DB:-vetbiobio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vetbiobio}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-vetbiobio}?schema=public
      - WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:3000}
      - API_PORT=3001
    env_file: .env

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:3001/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    env_file: .env

volumes:
  pgdata:
